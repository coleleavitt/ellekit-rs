[package]
name = "ellekit-sys"
version = "0.1.0"
edition = "2021"
authors = ["Cole <cole@example.com>"]
license = "MIT OR Apache-2.0"
description = "Unsafe Rust FFI bindings to ElleKit, a modern iOS/macOS hooking framework"
repository = "https://github.com/yourusername/ellekit-rs"
keywords = ["ios", "macos", "hooking", "jailbreak", "ffi"]
categories = ["external-ffi-bindings", "os::macos-apis"]
links = "ellekit"

[lib]
# Support building as cdylib for iOS tweaks
crate-type = ["rlib", "cdylib"]

[dependencies]
# Use ios-sys for iOS system types (Mach, Objective-C, etc.)
ios-sys = { git = "https://github.com/coleleavitt/ios-sys.git", branch = "main" }

# Use xnu-sys for XNU kernel APIs (including private APIs like code signing)
xnu-sys = { path = "../../xnu-sys" }

[features]
# Link against the actual ElleKit library (only available on jailbroken iOS/macOS)
# Without this feature, symbols are declared but not linked (header-only mode)
runtime = []

default = []

[package.metadata.docs.rs]
# Don't try to generate bindings on docs.rs
features = []
